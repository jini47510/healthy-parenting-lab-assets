<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F8FBFA"/>
  <rect x="70" y="64" width="940" height="1222" rx="42" fill="#FFFFFF" stroke="#DCEAE6" stroke-width="3"/>
  <text x="110" y="128" fill="#178371" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="2">BABY · HEALTH</text>
  <text x="110" y="210" fill="#0C2D4E" font-family="Arial, sans-serif" font-size="54" font-weight="800">누가, 언제 무료로</text>
  <text x="110" y="280" fill="#0C2D4E" font-family="Arial, sans-serif" font-size="54" font-weight="800">접종할 수 있나요?</text>
  <line x1="110" y1="326" x2="970" y2="326" stroke="#BFE4D8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="205" cy="463" r="70" fill="#DDF3EB"/><text x="205" y="481" text-anchor="middle" fill="#0C2D4E" font-size="48">👶</text>
  <text x="310" y="442" fill="#0C2D4E" font-family="Arial, sans-serif" font-size="36" font-weight="800">지원 대상</text>
  <text x="310" y="496" fill="#40576B" font-family="Arial, sans-serif" font-size="31">생후 6개월부터 14세까지</text>
  <text x="310" y="540" fill="#687B89" font-family="Arial, sans-serif" font-size="25">2012.1.1.~2026.8.31. 출생</text>
  <circle cx="205" cy="700" r="70" fill="#E9F0FA"/><text x="205" y="718" text-anchor="middle" fill="#0C2D4E" font-size="48">📅</text>
  <text x="310" y="679" fill="#0C2D4E" font-family="Arial, sans-serif" font-size="36" font-weight="800">지원 기간</text>
  <text x="310" y="733" fill="#40576B" font-family="Arial, sans-serif" font-size="31">2026.9.21.~2027.4.30.</text>
  <text x="310" y="777" fill="#687B89" font-family="Arial, sans-serif" font-size="25">1회·2회 접종 대상 모두 동일</text>
  <circle cx="205" cy="936" r="70" fill="#FFF1DA"/><text x="205" y="954" text-anchor="middle" fill="#0C2D4E" font-size="48">🏥</text>
  <text x="310" y="915" fill="#0C2D4E" font-family="Arial, sans-serif" font-size="36" font-weight="800">접종 장소</text>
  <text x="310" y="969" fill="#40576B" font-family="Arial, sans-serif" font-size="31">전국 지정 위탁의료기관·보건소</text>
  <text x="310" y="1013" fill="#687B89" font-family="Arial, sans-serif" font-size="25">방문 전 접종 가능 여부 확인</text>
  <rect x="110" y="1096" width="860" height="112" rx="24" fill="#E6F5F0"/>
  <text x="540" y="1144" text-anchor="middle" fill="#126B5C" font-family="Arial, sans-serif" font-size="27" font-weight="700">생후 6개월 미만 영아는 접종 대상이 아닙니다.</text>
  <text x="540" y="1182" text-anchor="middle" fill="#466B65" font-family="Arial, sans-serif" font-size="23">가족의 접종과 손 위생 등 생활수칙을 함께 확인하세요.</text>
  <text x="110" y="1252" fill="#178371" font-family="Arial, sans-serif" font-size="24" font-weight="700">Healthy Parenting Lab</text>
</svg>
