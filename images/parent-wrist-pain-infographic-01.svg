<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><rect width="1080" height="1350" fill="#F8FCFA"/><rect x="70" y="70" width="940" height="1210" rx="54" fill="#fff" stroke="#BFE8D5" stroke-width="6"/><text x="120" y="180" font-family="sans-serif" font-size="52" font-weight="700" fill="#092B4C">손목을 보호하는 돌봄 자세</text><g font-family="sans-serif" font-size="38" fill="#243746"><text x="140" y="360">01  손목은 가능한 한 곧게</text><text x="140" y="510">02  아기는 몸 가까이</text><text x="140" y="660">03  손보다 전완으로 넓게 받치기</text><text x="140" y="810">04  쿠션과 작업 높이 활용하기</text><text x="140" y="960">05  반복 동작을 가족과 나누기</text></g><rect x="120" y="1080" width="840" height="120" rx="30" fill="#DDF5EA"/><text x="540" y="1155" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#092B4C">힘 저하·감각 저하·심한 붓기는 진료가 필요할 수 있어요</text></svg>
