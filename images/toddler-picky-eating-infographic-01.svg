<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><rect width="1080" height="1350" fill="#F8FCFA"/><rect x="70" y="70" width="940" height="1210" rx="54" fill="#fff" stroke="#BFE8D5" stroke-width="6"/><text x="120" y="180" font-family="sans-serif" font-size="52" font-weight="700" fill="#092B4C">편식 대처의 핵심 원칙</text><g font-family="sans-serif" font-size="37" fill="#243746"><text x="140" y="355">✓ 식사와 간식 시간을 정해요</text><text x="140" y="505">✓ 익숙한 음식과 새 음식을 함께 내요</text><text x="140" y="655">✓ 거부해도 소량 다시 만나요</text><text x="140" y="805">✓ 억지로 먹이거나 보상하지 않아요</text><text x="140" y="955">✓ 한 끼보다 며칠의 흐름을 봐요</text></g><rect x="120" y="1080" width="840" height="115" rx="30" fill="#DDF5EA"/><text x="540" y="1150" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#092B4C">부모는 제공하고, 아이는 먹을 양을 결정해요</text></svg>
