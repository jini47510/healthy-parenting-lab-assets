    <text x="115" y="290" fill="#52697A" font-family="Arial, sans-serif" font-size="29">회복보다 먼저 위험을 줄이세요</text>
    <line x1="115" y1="342" x2="965" y2="342" stroke="#62BEA8" stroke-width="6" stroke-linecap="round"/>
