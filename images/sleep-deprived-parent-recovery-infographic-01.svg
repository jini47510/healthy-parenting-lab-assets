    <text x="540" y="1184" text-anchor="middle" fill="#49665F" font-family="Arial, sans-serif" font-size="23">개인 상태가 걱정되면 의료진의 안내를 우선하세요.</text>
    <text x="115" y="1260" fill="#178371" font-family="Arial, sans-serif" font-size="24" font-weight="700">Healthy Parenting Lab</text>
