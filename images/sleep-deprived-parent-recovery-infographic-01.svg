      <text x="260" y="506" fill="#0C2D4E" font-family="Arial, sans-serif" font-size="31" font-weight="750">졸린 상태로 운전하지 않기</text>
      <rect x="260" y="532" width="570" height="4" rx="2" fill="#FFFFFF" opacity=".75"/>
<rect x="115" y="650" width="850" height="170" rx="30" fill="#E8F0FA"/>
      <circle cx="190" cy="735" r="39" fill="#FFFFFF"/><text x="190" y="748" text-anchor="middle" fill="#0C2D4E" font-family="Arial, sans-serif" font-size="34" font-weight="800">2</text>
      <text x="260" y="726" fill="#0C2D4E" font-family="Arial, sans-serif" font-size="31" font-weight="750">소파에서 아기 안고 잠들지 않기</text>
