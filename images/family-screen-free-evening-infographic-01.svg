<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><rect width="1080" height="1350" fill="#F8FCFA"/><rect x="70" y="70" width="940" height="1210" rx="54" fill="#fff" stroke="#BFE8D5" stroke-width="6"/><text x="120" y="180" font-family="sans-serif" font-size="52" font-weight="700" fill="#092B4C">스크린 없는 저녁 60분</text><g font-family="sans-serif"><text x="130" y="350" font-size="40" fill="#247A69">60분 전</text><text x="380" y="350" font-size="36" fill="#243746">화면 끄기 · 조명 낮추기</text><text x="130" y="510" font-size="40" fill="#247A69">45분 전</text><text x="380" y="510" font-size="36" fill="#243746">씻기 · 잠옷 입기</text><text x="130" y="670" font-size="40" fill="#247A69">30분 전</text><text x="380" y="670" font-size="36" fill="#243746">조용한 놀이 · 그림책</text><text x="130" y="830" font-size="40" fill="#247A69">15분 전</text><text x="380" y="830" font-size="36" fill="#243746">짧은 대화 · 같은 인사</text></g><rect x="120" y="1010" width="840" height="150" rx="36" fill="#DDF5EA"/><text x="540" y="1080" text-anchor="middle" font-family="sans-serif" font-size="31" fill="#092B4C">완벽한 시간표보다</text><text x="540" y="1125" text-anchor="middle" font-family="sans-serif" font-size="31" fill="#092B4C">매일 비슷한 순서가 중요해요</text></svg>
