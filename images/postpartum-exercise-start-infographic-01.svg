<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><rect width="1080" height="1350" fill="#F8FCFA"/><rect x="70" y="70" width="940" height="1210" rx="54" fill="#fff" stroke="#BFE8D5" stroke-width="6"/><text x="120" y="180" font-family="sans-serif" font-size="52" font-weight="700" fill="#092B4C">출산 후 운동, 단계적으로</text><g font-family="sans-serif"><text x="140" y="365" font-size="42" fill="#247A69">1단계</text><text x="340" y="365" font-size="36" fill="#243746">짧은 걷기와 편안한 호흡</text><text x="140" y="560" font-size="42" fill="#247A69">2단계</text><text x="340" y="560" font-size="36" fill="#243746">골반저근 수축과 충분한 이완</text><text x="140" y="755" font-size="42" fill="#247A69">3단계</text><text x="340" y="755" font-size="36" fill="#243746">낮은 강도의 근력과 유산소</text></g><rect x="120" y="920" width="840" height="220" rx="36" fill="#DDF5EA"/><text x="540" y="995" text-anchor="middle" font-family="sans-serif" font-size="31" fill="#092B4C">통증·출혈 증가·어지럼이 있으면 멈추세요</text><text x="540" y="1050" text-anchor="middle" font-family="sans-serif" font-size="31" fill="#092B4C">제왕절개나 합병증이 있었다면</text><text x="540" y="1100" text-anchor="middle" font-family="sans-serif" font-size="31" fill="#092B4C">담당 의료진과 시작 시점을 확인하세요</text></svg>
